services:
  rabbitmq:
    image: rabbitmq:4.4.1-management
    hostname: eda-rabbitmq

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?Please set RABBITMQ_USER in .env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Please set RABBITMQ_PASSWORD in .env}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  rabbitmq_data: