name: Inventory ACK acceptance

on:
  push:
    branches: ['feature/integration-e']
    paths:
      - '.github/workflows/member-e-inventory-ack.yml'
      - 'scripts/rabbitmq_inventory_acceptance.py'
      - 'tests/test_e_integration.py'

permissions:
  contents: read

jobs:
  inventory-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_USER: eda_ci
      RABBITMQ_PASSWORD: ephemeral-ci-only
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate the tested C and D revisions in the runner
        run: |
          c=f8d58b9067d9bb20dc233f705c70e6384db0c43e
          d=49e428285e30637d3dd9a61f702e38b651f9f0b1
          git fetch --no-tags --depth=1 origin "$c" "$d"
          git archive "$c" common/event_schema.py data/products.json services/inventory_service.py services/order_service.py tests/test_event_schema.py tests/test_inventory_service.py tests/test_order_service.py | tar -x
          git archive "$d" services/payment_service.py services/notification_service.py | tar -x
      - name: Run unit and cross-service tests
        run: |
          python -m pip install -r requirements.txt 'Flask>=3.1,<4'
          python -m unittest discover -s tests -v
      - name: Verify ACK, replay and dead-letter routing on RabbitMQ
        run: |
          docker compose up -d --wait --wait-timeout 150
          python -m scripts.setup_rabbitmq
          python -m scripts.rabbitmq_inventory_acceptance
      - name: RabbitMQ logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
