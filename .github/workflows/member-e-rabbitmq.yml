name: Member E RabbitMQ acceptance

on:
  push:
    branches: ['feature/integration-e']
    paths: ['.github/workflows/member-e-rabbitmq.yml']

permissions:
  contents: read

jobs:
  rabbitmq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_USER: eda_ci
      RABBITMQ_PASSWORD: ephemeral-ci-only
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate C and D in the runner workspace
        run: |
          c=80d886c01794170bad891a4cfa78132d9311db61
          d=49e428285e30637d3dd9a61f702e38b651f9f0b1
          git fetch --no-tags --depth=1 origin "$c" "$d"
          git archive "$c" common/event_schema.py data/products.json services/inventory_service.py services/order_service.py tests/test_inventory_service.py | tar -x
          git archive "$d" services/payment_service.py services/notification_service.py | tar -x
      - name: Install dependencies and initialize RabbitMQ
        run: |
          python -m pip install -r requirements.txt 'Flask>=3.1,<4'
          docker compose up -d --wait --wait-timeout 150
          python -m scripts.setup_rabbitmq
      - name: Run unit and contract tests
        run: |
          python -m unittest discover -s tests -p test_e_integration.py -v
          python -m unittest discover -s tests -p test_inventory_service.py -v
      - name: Verify live delivery, acknowledgement and dead-letter routing
        run: |
          python - <<'PY'
          import json
          import re
          from time import monotonic, sleep
          from app import create_app
          from common.config import QUEUES
          from common.messaging import consume_events, get_connection
          from services import inventory_service, notification_service, payment_service

          client = create_app().test_client()
          main = client.get('/').get_data(as_text=True)
          token = re.search(r'name="form_token" value="([^"]+)"', main)[1]
          connection = get_connection()
          channel = connection.channel()

          def ready(queue, expected):
              deadline = monotonic() + 10
              while True:
                  count = channel.queue_declare(queue=queue, passive=True).method.message_count
                  if count == expected:
                      return
                  if monotonic() >= deadline:
                      raise AssertionError(f'{queue}: expected {expected}, got {count}')
                  sleep(0.1)

          def order():
              result = client.post('/orders', data={'form_token': token, 'product_id': 'P001',
                                   'quantity': '2', 'unit_price': '500.00'}, follow_redirects=True)
              page = result.get_data(as_text=True)
              assert result.status_code == 200 and 'RabbitMQ 已確認發布' in page, page
              return re.search(r'事件編號 <code>([^<]+)</code>', page)[1]

          def lookup(event_id):
              return client.get('/', query_string={'event_id': event_id}).get_data(as_text=True)

          try:
              for queue in QUEUES.values():
                  ready(queue, 0)
              ready(QUEUES['payment'] + '.dlq', 0)
              event_id = order()
              for queue in QUEUES.values():
                  ready(queue, 1)
              consume_events(QUEUES['inventory'], inventory_service.process_order_created, once=True)
              consume_events(QUEUES['payment'], payment_service.handle_event, once=True)
              inventory = inventory_service.load_inventory()
              assert event_id in inventory['processed_event_ids']
              assert next(p['stock'] for p in inventory['products'] if p['product_id'] == 'P001') == 8
              ready(QUEUES['inventory'], 0)
              ready(QUEUES['payment'], 0)
              ready(QUEUES['notification'], 1)
              assert '付款 · 成功' in lookup(event_id)
              assert '通知 · 已記錄' not in lookup(event_id)
              consume_events(QUEUES['notification'], notification_service.handle_event, once=True)
              ready(QUEUES['notification'], 0)
              assert '通知 · 已記錄' in lookup(event_id)
              print(f'PASS {event_id}: P001 stock 10 -> 8; payment success; notification ready 1 -> 0 after consumer start')

              declined = order()
              ready(QUEUES['payment'], 1)
              consume_events(QUEUES['payment'], lambda event: payment_service.handle_event(event, mode='decline'), once=True)
              ready(QUEUES['payment'], 0)
              ready(QUEUES['payment'] + '.dlq', 0)
              assert '付款遭拒' in lookup(declined)
              print(f'PASS {declined}: payment declined and acknowledged without dead-letter routing')

              failed = order()
              ready(QUEUES['payment'], 1)
              consume_events(QUEUES['payment'], lambda event: payment_service.handle_event(event, mode='error'), once=True)
              ready(QUEUES['payment'], 0)
              ready(QUEUES['payment'] + '.dlq', 1)
              method, _, payload = channel.basic_get(QUEUES['payment'] + '.dlq', auto_ack=False)
              assert method is not None and json.loads(payload)['event_id'] == failed
              channel.basic_ack(method.delivery_tag)
              print(f'PASS {failed}: technical payment failure routed to payment DLQ')
          finally:
              connection.close()
          PY
      - name: RabbitMQ diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100
